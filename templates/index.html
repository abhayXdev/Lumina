<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JioSaavn AI Bot - JARVIS Interface</title>
    <style>
        :root {
            --primary-color: #00e5ff;
            --bg-color: #0a0b0d;
            --card-bg: #161b22;
            --text-color: #e6edf3;
            --accent-color: #1f6feb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #30363d;
            background: linear-gradient(180deg, #161b22 0%, #0a0b0d 100%);
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: var(--primary-color);
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scrollbar-width: thin;
            scrollbar-color: #30363d transparent;
        }

        #chat-container::-webkit-scrollbar {
            width: 6px;
        }

        #chat-container::-webkit-scrollbar-thumb {
            background-color: #30363d;
            border-radius: 10px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 1rem;
            line-height: 1.5;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--accent-color);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .bot-message {
            align-self: flex-start;
            background-color: var(--card-bg);
            border: 1px solid #30363d;
            border-bottom-left-radius: 2px;
        }

        .system-message {
            align-self: center;
            font-size: 0.8rem;
            color: #8b949e;
            font-style: italic;
        }

        #controls {
            padding: 20px;
            background-color: var(--card-bg);
            border-top: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background-color: #0d1117;
            border: 1px solid #30363d;
            color: white;
            padding: 12px 16px;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        button {
            background-color: var(--primary-color);
            color: black;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.98);
        }

        button.stop-btn {
            background-color: #f85149;
            color: white;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #8b949e;
        }

        .dot {
            height: 8px;
            width: 8px;
            background-color: #238636;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
            box-shadow: 0 0 5px #238636;
        }

        .typing .dot {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <header>
        <h1>JioSaavn AI Bot</h1>
    </header>

    <div id="chat-container">
        <div class="message bot-message">System online. Greetings, Sir. How may I assist you today?</div>
    </div>

    <div id="controls">
        <div class="status-bar">
            <span><span class="dot"></span> Backend Active</span>
            <span id="esp-status">Target: Waiting...</span>
        </div>
        <div class="input-group">
            <input type="text" id="userInput" placeholder="Ask Jarvis to play music or talk..." autofocus>
            <button id="sendBtn">SEND</button>
        </div>
        <div class="input-group" style="justify-content: center;">
            <button id="stopBtn" class="stop-btn">STOP PLAYBACK</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const stopBtn = document.getElementById('stopBtn');

        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}-message`;
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function handleSend() {
            const msg = userInput.value.trim();
            if (!msg) return;

            addMessage(msg, 'user');
            userInput.value = '';
            
            // Show typing indicator
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot-message typing';
            typingDiv.innerHTML = '<span class="dot"></span> Jarvis is thinking...';
            chatContainer.appendChild(typingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ msg: msg })
                });
                
                const data = await response.json();
                chatContainer.removeChild(typingDiv);

                if (data.error) {
                    addMessage("System Error: " + data.error, 'bot');
                } else {
                    addMessage(data.reply, 'bot');
                    if (data.intent === 'play') {
                        const systemMsg = document.createElement('div');
                        systemMsg.className = 'system-message';
                        systemMsg.innerText = `Searching JioSaavn for: ${data.query}...`;
                        chatContainer.appendChild(systemMsg);
                    }
                }
            } catch (error) {
                chatContainer.removeChild(typingDiv);
                addMessage("Communication Error. Ensure the backend is running.", 'bot');
            }
        }

        async function handleStop() {
            try {
                await fetch('/stop', { method: 'POST' });
                const systemMsg = document.createElement('div');
                systemMsg.className = 'system-message';
                systemMsg.innerText = "Playback stopped.";
                chatContainer.appendChild(systemMsg);
            } catch (error) {
                console.error("Stop error:", error);
            }
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });
        stopBtn.addEventListener('click', handleStop);

        // Periodically update ESP status if needed (could be implemented in server)
    </script>
</body>
</html>
