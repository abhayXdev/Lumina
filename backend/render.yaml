services:
  - type: web
    name: jarvis-wakeword-backend
    env: python
    buildCommand: "pip install -r requirements.txt && python -c \"import openwakeword; openwakeword.utils.download_models()\""
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: API_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
